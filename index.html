<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta property="og:title" content="WebTools: Kanban">
    <meta property="og:description" content="A modern, responsive Kanban board implementation featuring drag-and-drop functionality, dark mode support, and local storage persistence.">
    <meta property="og:url" content="https://pages.ikoyski.top/webtools-kanban/">
    <meta charset="UTF-8">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Kanban Board</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SortableJS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="src/css/style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                            950: '#172554',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 transition-colors duration-300 min-h-screen flex flex-col">

    <!-- App Views Wrapper -->
    <div id="app-auth-view" class="flex-1 flex items-center justify-center p-4 bg-slate-50 dark:bg-slate-900">
        <!-- Login Card -->
        <div id="login-card" class="w-full max-w-md bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 p-8 transition-all">
            <div class="text-center mb-8">
                <div class="bg-primary-600 text-white w-12 h-12 rounded-lg shadow-lg flex items-center justify-center mx-auto mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6 0h3m-3 4h3" />
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-slate-800 dark:text-slate-100">Welcome Back</h2>
                <p class="text-slate-500 dark:text-slate-400 text-sm mt-2">Please enter your details to sign in</p>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1 opacity-70">Email</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent focus:ring-2 focus:ring-primary-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 opacity-70">Password</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent focus:ring-2 focus:ring-primary-500 outline-none transition-all">
                </div>
                <button type="submit" class="w-full py-2 px-4 bg-primary-600 hover:bg-primary-700 text-white font-bold rounded-lg shadow-md transition-all active:scale-95">Sign In</button>
            </form>
            <div class="mt-6 text-center text-sm text-slate-500 dark:text-slate-400">
                Don't have an account? <a href="#" id="show-signup" class="text-primary-600 hover:underline font-medium">Sign up for free</a>
            </div>
        </div>
        <!-- Signup Card -->
        <div id="signup-card" class="w-full max-w-md bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 p-8 transition-all hidden">
            <div class="text-center mb-8">
                <div class="bg-primary-600 text-white w-12 h-12 rounded-lg shadow-lg flex items-center justify-center mx-auto mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-slate-800 dark:text-slate-100">Create Account</h2>
                <p class="text-slate-500 dark:text-slate-400 text-sm mt-2">Join us and start organizing your tasks</p>
            </div>
            <form id="signup-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1 opacity-70">Display Name</label>
                    <input type="text" id="signup-name" required class="w-full px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent focus:ring-2 focus:ring-primary-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 opacity-70">Email</label>
                    <input type="email" id="signup-email" required class="w-full px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent focus:ring-2 focus:ring-primary-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 opacity-70">Password</label>
                    <input type="password" id="signup-password" required class="w-full px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent focus:ring-2 focus:ring-primary-500 outline-none transition-all">
                </div>
                <button type="submit" class="w-full py-2 px-4 bg-primary-600 hover:bg-primary-700 text-white font-bold rounded-lg shadow-md transition-all active:scale-95">Create Account</button>
            </form>
            <div class="mt-6 text-center text-sm text-slate-500 dark:text-slate-400">
                Already have an account? <a href="#" id="show-login" class="text-primary-600 hover:underline font-medium">Sign in here</a>
            </div>
        </div>
    </div>

                    </div>
