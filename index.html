<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Draftbench — Learn to Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F2F1EC;
    --paper-raised: #FFFFFF;
    --ink: #1B2430;
    --ink-soft: #5B6674;
    --blue: #2B4C6F;
    --blue-soft: #7FA3C0;
    --grid-line: rgba(43,76,111,0.12);
    --amber: #E0A03D;
    --amber-ink: #7A4A0E;
    --success: #2E6B4C;
    --success-bg: #E3F0E8;
    --danger: #A6432B;
    --danger-bg: #F8E7E2;
    --border: rgba(27,36,48,0.16);
    --radius: 4px;
    --editor-bg: #161B22;
    --editor-ink: #DDE4EA;
    --editor-line: rgba(255,255,255,0.10);
    --font-serif: 'IBM Plex Serif', Georgia, serif;
    --font-sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #12161C;
      --paper-raised: #1A212A;
      --ink: #E7E9EC;
      --ink-soft: #9AA5B1;
      --blue: #8FB6D8;
      --blue-soft: #4A7396;
      --grid-line: rgba(143,182,216,0.14);
      --amber: #EFB65B;
      --amber-ink: #2A1B05;
      --success: #7FCBA0;
      --success-bg: rgba(63,125,92,0.20);
      --danger: #E2917A;
      --danger-bg: rgba(166,67,43,0.22);
      --border: rgba(231,233,236,0.16);
    }
  }
  :root[data-theme="dark"] {
    --paper: #12161C;
    --paper-raised: #1A212A;
    --ink: #E7E9EC;
    --ink-soft: #9AA5B1;
    --blue: #8FB6D8;
    --blue-soft: #4A7396;
    --grid-line: rgba(143,182,216,0.14);
    --amber: #EFB65B;
    --amber-ink: #2A1B05;
    --success: #7FCBA0;
    --success-bg: rgba(63,125,92,0.20);
    --danger: #E2917A;
    --danger-bg: rgba(166,67,43,0.22);
    --border: rgba(231,233,236,0.16);
  }

  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100%;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--ink);
    font-family: var(--font-sans);
    line-height: 1.55;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  h1, h2, h3 { font-family: var(--font-serif); font-weight: 600; margin: 0 0 8px; line-height: 1.25; }
  p { margin: 0 0 12px; }
  button { font-family: inherit; }
  code { font-family: var(--font-mono); background: rgba(43,76,111,0.10); padding: 1px 5px; border-radius: 3px; font-size: 0.92em; }
  *:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* ---------- Header ---------- */
  .site-header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; padding-top: calc(14px + env(safe-area-inset-top, 0px));
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
  }
  .wordmark {
    background: none; border: none; cursor: pointer;
    font-family: var(--font-serif); font-weight: 600; font-size: 19px; color: var(--ink);
    padding: 0;
  }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .header-progress { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--paper-raised);
    color: var(--ink); cursor: pointer; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { border-color: var(--blue-soft); }

  main#app { max-width: 980px; margin: 0 auto; padding: 32px 20px 80px; }

  /* ---------- Breadcrumb ---------- */
  .breadcrumb {
    font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-soft);
    margin-bottom: 22px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
  }
  .breadcrumb button { background: none; border: none; color: var(--ink-soft); cursor: pointer; font-family: inherit; font-size: inherit; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
  .breadcrumb button:hover { color: var(--blue); }
  .breadcrumb span { color: var(--ink); }

  /* ---------- Hero / Home ---------- */
  .title-block { display: inline-block; margin-bottom: 22px; }
  .stamp-label {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em;
    color: var(--blue); border: 1px solid var(--border); padding: 5px 10px; border-radius: 3px;
    background: var(--paper-raised);
  }
  .hero-title { font-size: clamp(30px, 5vw, 46px); max-width: 14ch; margin-bottom: 16px; }
  .hero-sub { max-width: 62ch; color: var(--ink-soft); font-size: 16px; margin-bottom: 8px; }

  .sheet-grid {
    margin-top: 30px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;
  }
  @media (max-width: 640px) { .sheet-grid { grid-template-columns: 1fr; } }
  .sheet {
    display: flex; text-align: left; background: var(--paper-raised);
    border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer;
    padding: 0; overflow: hidden; color: inherit; font-family: inherit;
  }
  .sheet:hover { border-color: var(--tab-color, var(--blue-soft)); }
  .sheet-tab { width: 6px; background: var(--tab-color, var(--blue)); flex-shrink: 0; }
  .sheet-body { padding: 18px 20px; flex: 1; }
  .sheet-meta, .track-progress-label, .lesson-num {
    font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); letter-spacing: 0.02em;
  }
  .sheet-title { font-size: 20px; margin: 6px 0 6px; }
  .sheet-desc { color: var(--ink-soft); font-size: 14.5px; margin-bottom: 12px; }
  .sheet-progress { height: 5px; background: var(--grid-line); border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
  .sheet-progress.wide { max-width: 320px; }
  .sheet-progress-fill { height: 100%; background: var(--tab-color, var(--amber)); }
  .sheet-status { font-size: 13px; color: var(--ink-soft); }

  /* ---------- Track view ---------- */
  .track-header { display: flex; gap: 16px; background: var(--paper-raised); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; margin-bottom: 22px; overflow: hidden; }
  .track-tab { width: 6px; background: var(--tab-color, var(--blue)); flex-shrink: 0; margin: -20px 0 -20px -22px; }
  .track-header p { color: var(--ink-soft); }
  .track-progress-label { display: inline-block; margin-top: 6px; }

  .lesson-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 26px; }
  .lesson-row {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    background: var(--paper-raised); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; cursor: pointer; color: inherit;
  }
  .lesson-row:hover { border-color: var(--blue-soft); }
  .lesson-row-title { flex: 1; font-size: 15.5px; }
  .lesson-check { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--success); flex-shrink: 0; }
  .lesson-check.done { background: var(--success-bg); border-color: var(--success); }

  .inspection-card {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--paper-raised); border: 1.5px dashed var(--border); border-radius: var(--radius);
    padding: 18px 20px; text-align: left; cursor: pointer; color: inherit;
  }
  .inspection-card:hover { border-color: var(--amber); }
  .inspection-card h3 { margin: 4px 0 4px; font-size: 17px; }
  .inspection-card p { margin: 0; color: var(--ink-soft); font-size: 14px; }
  .inspection-arrow { font-size: 18px; color: var(--success); }

  /* ---------- Lesson view ---------- */
  .lesson-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 860px) { .lesson-grid { grid-template-columns: 1fr; } }
  .panel { background: var(--paper-raised); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; }
  .panel-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; color: var(--ink-soft); margin-bottom: 10px; }
  .panel-label.accent { color: var(--amber-ink); }
  .lesson-copy p { color: var(--ink); font-size: 15.5px; }
  .code-card { margin-top: 16px; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .code-card-head { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); padding: 7px 12px; border-bottom: 1px solid var(--border); background: var(--paper); }
  .code-block { margin: 0; padding: 14px; background: var(--editor-bg); color: var(--editor-ink); overflow-x: auto; font-size: 13px; }
  .code-block code { background: none; padding: 0; color: inherit; }

  .tok-tag { color: #7FB0E0; }
  .tok-attr { color: #E0A03D; }
  .tok-str { color: #8FE3B0; }
  .tok-sel { color: #7FB0E0; font-weight: 600; }
  .tok-prop { color: #E0A03D; }
  .tok-val { color: #DDE4EA; }
  .tok-kw { color: #7FB0E0; font-weight: 600; }
  .tok-num { color: #8FE3B0; }
  .tok-com { color: #6B7684; font-style: italic; }

  .editor-card { border: 1px solid var(--editor-line); border-radius: var(--radius); overflow: hidden; background: var(--editor-bg); }
  .editor-tabs { display: flex; border-bottom: 1px solid var(--editor-line); }
  .editor-tab { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); padding: 8px 14px; cursor: pointer; color: #9AA5B1; }
  .editor-tab.active { color: var(--editor-ink); background: rgba(255,255,255,0.06); border-bottom: 2px solid var(--amber); }
  .editor-textarea {
    display: block; width: 100%; min-height: 160px; resize: vertical;
    background: var(--editor-bg); color: var(--editor-ink); border: none; outline: none;
    font-family: var(--font-mono); font-size: 13px; padding: 14px; line-height: 1.5;
  }
  .editor-textarea.hidden { display: none; }
  .editor-toolbar { display: flex; align-items: center; gap: 10px; margin: 12px 0; }
  .editor-hint { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-soft); }
  .preview-card { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: #fff; }
  .preview-head { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); padding: 7px 12px; border-bottom: 1px solid var(--border); background: var(--paper); }
  .preview-frame { display: block; width: 100%; height: 260px; border: none; background: #fff; }

  .btn {
    font-family: var(--font-mono); font-size: 13px; padding: 10px 16px; border-radius: var(--radius);
    cursor: pointer; border: 1px solid transparent;
  }
  .btn.small { padding: 7px 12px; font-size: 12px; }
  .btn.primary { background: var(--amber); color: var(--amber-ink); font-weight: 600; border-color: var(--amber); }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--border); }
  .btn.ghost:hover { border-color: var(--blue-soft); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .lesson-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; }

  /* ---------- Quiz view ---------- */
  .quiz-header { margin-bottom: 20px; }
  .quiz-header p { color: var(--ink-soft); }
  .quiz-list { display: flex; flex-direction: column; gap: 18px; margin-bottom: 24px; }
  .quiz-question { background: var(--paper-raised); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
  .quiz-q-label { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); margin-bottom: 6px; }
  .quiz-q-text { font-size: 15.5px; margin-bottom: 12px; }
  .quiz-options { display: flex; flex-direction: column; gap: 8px; }
  .quiz-option {
    text-align: left; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--paper); cursor: pointer; font-family: var(--font-sans); font-size: 14.5px; color: var(--ink);
  }
  .quiz-option:hover { border-color: var(--blue-soft); }
  .quiz-option.selected { border-color: var(--amber); background: color-mix(in srgb, var(--amber) 14%, var(--paper)); }
  .quiz-option.correct { border-color: var(--success); background: var(--success-bg); }
  .quiz-option.incorrect { border-color: var(--danger); background: var(--danger-bg); }
  .quiz-option:disabled { cursor: default; }
  .quiz-explain { margin-top: 10px; font-size: 13.5px; color: var(--ink-soft); border-top: 1px dashed var(--border); padding-top: 10px; }

  .stamp-result { display: flex; align-items: center; gap: 18px; margin-bottom: 22px; }
  .stamp {
    font-family: var(--font-mono); font-weight: 600; font-size: 20px; letter-spacing: 0.08em;
    border: 3px solid; border-radius: 8px; padding: 10px 18px; transform: rotate(-5deg);
  }
  .stamp-result.pass .stamp { color: var(--success); border-color: var(--success); }
  .stamp-result.fail .stamp { color: var(--danger); border-color: var(--danger); }
  .stamp-result p { color: var(--ink-soft); margin: 0; }
</style>
</head>
<body>
  <header class="site-header">
    <button class="wordmark" data-action="go-home">Draftbench</button>
    <div class="header-right">
      <span id="header-progress" class="header-progress"></span>
      <button id="theme-toggle" data-action="toggle-theme" class="icon-btn" aria-label="Toggle theme">&#9789;</button>
    </div>
  </header>
  <main id="app"></main>

<script>
(function () {
  'use strict';

  /* ================= DATA ================= */
  var COURSES = [
    {
      id: 'html', title: 'HTML Foundations', color: '#E34C26',
      description: 'Structure every page with the tags that hold the web together.',
      lessons: [
        {
          id: 'h1', title: 'Tags, Elements and Structure',
          content: [
            'Every web page is built from HTML elements, pieces marked with tags like `<p>` or `<h1>` that tell the browser what something is, not how it looks.',
            'Most tags come in pairs: an opening tag `<p>` and a closing tag `</p>`, with content in between. A few, like `<img>` and `<br>`, stand alone.',

          exampleLang: 'html',
          example: '<!DOCTYPE html>\n<html>\n  <head>\n    <title>My First Page</title>\n  </head>\n  <body>\n    <h1>Hello, world!</h1>\n    <p>This is my first paragraph.</p>\n  </body>\n</html>',
          sandbox: { type: 'html', starter: { html: '<h1>Hello, world!</h1>\n<p>Edit this text and watch the preview update.</p>' } }
        },
        {
          id: 'h2', title: 'Text and Headings',
          content: [
            'Headings `<h1>` through `<h6>` create a page outline. `<h1>` is the most important, `<h6>` the least. Use them in order; do not skip a level just to make text bigger.',
            'Paragraphs live in `<p>` tags. Inside a paragraph, `<strong>` marks text as important (shown bold) and `<em>` marks it as emphasized (shown italic).',
            'A line break inside a paragraph is `<br>`, but reach for it rarely. A new `<p>` is usually the better choice for a new thought.'
          ],
          exampleLang: 'html',
          example: '<h1>Backyard Garden Log</h1>\n<h2>Week One</h2>\n<p>The <strong>tomato</strong> seedlings sprouted today. <em>Finally</em>.</p>',
          sandbox: { type: 'html', starter: { html: '<h1>My Page Title</h1>\n<h2>A Section</h2>\n<p>Try adding <strong>bold</strong> or <em>italic</em> text here.</p>' } }
        },
        {
          id: 'h3', title: 'Links and Images',
          content: [
            'The `<a>` tag creates a link. Its `href` attribute is the destination: `<a href="https://example.com">Visit</a>`. Attributes always live inside the opening tag.',
            'Images use `<img>`, which never has a closing tag. `src` points to the file, and `alt` describes the image for screen readers or when the image fails to load. Never skip `alt`.',
            'Attribute values go in quotes, `attribute="value"`. Mixing that up is one of the most common beginner slips.'
          ],
          exampleLang: 'html',
          example: '<a href="https://example.com">Visit example.com</a>\n<img src="https://placekitten.com/200/150" alt="A sleeping kitten">',
          sandbox: { type: 'html', starter: { html: '<a href="https://example.com">A link somewhere</a>\n<p>Add an image below with a src and an alt.</p>' } }
        },
        {
          id: 'h4', title: 'Lists and Tables',
          content: [
            'An unordered list `<ul>` holds bullet points; an ordered list `<ol>` numbers them. Either way, each item goes in an `<li>` tag.',
            'Tables organize data into rows and columns. `<table>` wraps everything, `<tr>` is a row, and each cell is `<td>` (or `<th>` for a header cell).',
            'Nesting matters. A `<li>` only makes sense inside a `<ul>` or `<ol>`, and a `<td>` only inside a `<tr>`.'
          ],
          exampleLang: 'html',
          example: '<ul>\n  <li>Milk</li>\n  <li>Eggs</li>\n</ul>\n<table>\n  <tr><th>Day</th><th>Task</th></tr>\n  <tr><td>Mon</td><td>Water plants</td></tr>\n</table>',
          sandbox: { type: 'html', starter: { html: '<ul>\n  <li>First item</li>\n  <li>Second item</li>\n</ul>' } }
        },
        {
          id: 'h5', title: 'Forms and Inputs',
          content: [
            'Forms collect input from a person and typically send it somewhere. The `<form>` element wraps everything, and each field usually has a matching `<label>` so people know what to type.',
            '`<input>` comes in many flavors set by its `type` attribute, `text`, `email`, `password`, `checkbox`, and more. Like `<img>`, it never has a closing tag.',
            'A `<button>` triggers the form. Connect a label to its input with `for` and a matching `id`, so clicking the label focuses the field.'
          ],
          exampleLang: 'html',
          example: '<form>\n  <label for="name">Name</label>\n  <input type="text" id="name">\n  <button type="submit">Send</button>\n</form>',
          sandbox: { type: 'html', starter: { html: '<form>\n  <label for="email">Email</label>\n  <input type="email" id="email">\n  <button type="submit">Sign up</button>\n</form>' } }
        },
        {
          id: 'h6', title: 'Semantic HTML5 Elements',
          content: [
            'Semantic elements describe the role of a section, not just its box. `<header>`, `<nav>`, `<main>`, `<section>`, `<article>`, and `<footer>` all behave like `<div>` visually, but they tell browsers and screen readers what each part is for.',
            'A `<nav>` wraps primary navigation links. A `<main>` wraps the one central content area of a page, used only once. An `<article>` is a self-contained piece, such as a blog post, that would make sense on its own.',
            'Reaching for a semantic tag before a generic `<div>` makes a page easier to navigate with assistive technology, and easier for another developer to read.'
          ],
          exampleLang: 'html',
          example: '<header>\n  <h1>My Blog</h1>\n  <nav><a href="#">Home</a></nav>\n</header>\n<main>\n  <article>\n    <h2>First Post</h2>\n    <p>Welcome to the blog.</p>\n  </article>\n</main>',
          sandbox: { type: 'html', starter: { html: '<header>\n  <h1>My Site</h1>\n  <nav><a href="#">Home</a> <a href="#">About</a></nav>\n</header>\n<main>\n  <article>\n    <h2>A Post Title</h2>\n    <p>Some content here.</p>\n  </article>\n</main>' } }
        },
        {
          id: 'h7', title: 'Divs, Spans, and Attributes',
          content: [
            '`<div>` is a generic block-level container with no meaning of its own, useful for grouping content to style or position as a unit. `<span>` is the same idea, but inline, for wrapping a small piece of text inside a sentence.',
            'The `class` attribute can be reused across many elements to style them the same way; `id` should be unique to one element on the page, often used as a target for links or scripts.',
            'A `data-*` attribute stores extra information on an element that is not meant to be shown, such as `data-user-id="42"`, which JavaScript can read later.'

        { question: 'Which heading tag represents the most important heading on a page?', options: ['<h6>', '<h1>', '<head>', '<header>'], correct: 1, explanation: 'Headings run from most important, `<h1>`, to least, `<h6>`.' },
        { question: 'Which tag does not need a closing tag?', options: ['<p>', '<div>', '<img>', '<ul>'], correct: 2, explanation: '`<img>` is a self-contained element with no closing tag.' },
        { question: 'What attribute on `<a>` sets the link destination?', options: ['src', 'href', 'link', 'target-url'], correct: 1, explanation: '`href` points to where the link goes.' },

          example: 'const form = document.querySelector("#myForm");\nform.addEventListener("submit", (event) => {\n  event.preventDefault();\n  console.log("Form submitted");\n});',
          sandbox: { type: 'js', starter: {
            html: '<form id="myForm">\n  <input type="text" placeholder="Type something">\n  <button type="submit">Submit</button>\n</form>',
            js: 'const form = document.querySelector("#myForm");\nform.addEventListener("submit", (event) => {\n  event.preventDefault();\n  console.log("Form submitted");\n});'
          } }
        }
      ],
      quiz: [
        { question: 'Which keyword should be used for a variable that will never be reassigned?', options: ['let', 'const', 'var', 'static'], correct: 1, explanation: '`const` signals a binding that will not be reassigned.' },
        { question: 'What does a function return if it has no `return` statement?', options: ['0', 'An empty string', 'undefined', 'An error'], correct: 2, explanation: 'A function without `return` gives back `undefined`.' },
        { question: 'How many times does `for (let i = 0; i < 4; i++)` run its body?', options: ['3', '4', '5', 'Infinite'], correct: 1, explanation: 'It runs for i = 0, 1, 2, 3, four times in total.' },
        { question: 'Which method finds the first element matching a CSS selector?', options: ['document.getElementById only', 'document.querySelector', 'document.findElement', 'document.select'], correct: 1, explanation: '`document.querySelector` accepts any CSS selector and returns the first match.' },
        { question: 'Which line makes a button respond to clicks?', options: ['btn.onHover(fn)', 'btn.addEventListener("click", fn)', 'btn.click = fn', 'btn.run(fn)'], correct: 1, explanation: '`addEventListener` attaches a handler for a given event type.' },
        { question: 'What does `.push(value)` do to an array?', options: ['Removes the first item', 'Adds a value to the end', 'Sorts the array', 'Empties the array'], correct: 1, explanation: '`.push` adds one or more values to the end of an array.' },
        { question: 'How do you read the `name` key on an object called `user`?', options: ['user->name', 'user.name', 'user::name', 'user(name)'], correct: 1, explanation: 'Dot notation, `user.name`, reads a key from an object.' },
        { question: 'What does `event.preventDefault()` do inside a form submit handler?', options: ['Deletes the form', 'Stops the browser from reloading the page', 'Cancels all future events', 'Clears the input fields'], correct: 1, explanation: 'It stops the default browser behavior for that event, such as a full page reload on submit.' }
      ]
    }
  ];

  /* ================= STATE ================= */
  var route = { view: 'home', courseId: null, lessonIdx: 0 };
  var progress = loadProgress();
  var quizState = {};
  var autoRunTimer = null;

  /* ================= STORAGE ================= */
  function loadProgress() {
    try { return JSON.parse(localStorage.getItem('db_progress') || '{}'); }
    catch (e) { return {}; }
  }
  function saveProgress() {
    try { localStorage.setItem('db_progress', JSON.stringify(progress)); }
    catch (e) { /* ignore */ }
  }
  function saveSandbox(key, code) {
    try { localStorage.setItem('db_sandbox_' + key, JSON.stringify(code)); }
    catch (e) { /* ignore */ }
  }
  function loadSandbox(key) {
    try {
      var v = localStorage.getItem('db_sandbox_' + key);
      return v ? JSON.parse(v) : null;
    } catch (e) { return null; }
  }

  /* ================= TEXT HELPERS ================= */
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .split('&').join('&amp;')
      .split('<').join('&lt;')
      .split('>').join('&gt;')
      .split('"').join('&quot;');
  }
  function renderInline(text) {
    var parts = String(text).split('`');
    var out = '';
    for (var i = 0; i < parts.length; i++) {
      out += (i % 2 === 1) ? ('<code>' + escapeHtml(parts[i]) + '</code>') : escapeHtml(parts[i]);
    }
    return out;
  }

  function highlightHTML(src) {
    var s = escapeHtml(src);
    s = s.replace(/(&lt;\/?[a-zA-Z][a-zA-Z0-9-]*)([\s\S]*?)(\/?&gt;)/g, function (m, open, attrs, close) {
      var attrHtml = attrs.replace(/([a-zA-Z-:]+)(=)(&quot;[\s\S]*?&quot;)/g,
        '<span class="tok-attr">$1</span>$2<span class="tok-str">$3</span>');
      return '<span class="tok-tag">' + open + '</span>' + attrHtml + '<span class="tok-tag">' + close + '</span>';
    });
    return s;
  }
  function highlightCSS(src) {
    var lines = src.split('\n');
    var out = lines.map(function (line) {
      var trimmed = line.trim();
      if (trimmed.slice(-1) === '{') {
        var idx = line.lastIndexOf('{');
        return '<span class="tok-sel">' + escapeHtml(line.slice(0, idx)) + '</span>{';
      }
      if (trimmed === '}' || trimmed === '') return escapeHtml(line);
      var colonIdx = line.indexOf(':');
      if (colonIdx > -1 && trimmed.slice(-1) === ';') {
        var prop = line.slice(0, colonIdx);
        var rest = line.slice(colonIdx + 1);
        return '<span class="tok-prop">' + escapeHtml(prop) + '</span>:<span class="tok-val">' + escapeHtml(rest) + '</span>';
      }
      return escapeHtml(line);
    });
    return out.join('\n');
  }
  function highlightJS(src) {
    var s = escapeHtml(src);
    /* Keyword pass runs first, on plain text with no spans yet. Running it
       after the other passes made it match the word "class" inside spans
       like <span class="tok-str">, since "class" is also a JS keyword. */
    s = s.replace(/\b(const|let|var|function|return|if|else|for|while|true|false|null|undefined|new|class|this|typeof|break|continue|console|document)\b/g,
      '<span class="tok-kw">$1</span>');
    s = s.replace(/(&quot;.*?&quot;|'.*?')/g, '<span class="tok-str">$1</span>');
    s = s.replace(/(\/\/[^\n]*)/g, '<span class="tok-com">$1</span>');
    s = s.replace(/\b(\d+(\.\d+)?)\b/g, '<span class="tok-num">$1</span>');
    return s;
  }

  /* ================= PROGRESS HELPERS ================= */
  function progressForCourse(courseId) {
    if (!progress[courseId]) progress[courseId] = { completed: [], quizBest: 0, quizPassed: false };
    return progress[courseId];
  }
  function isLessonComplete(courseId, lessonId) {
    return progressForCourse(courseId).completed.indexOf(lessonId) !== -1;
  }
  function markComplete(courseId, lessonId) {
    var p = progressForCourse(courseId);
    if (p.completed.indexOf(lessonId) === -1) p.completed.push(lessonId);
    saveProgress();
  }
  function totalLessonsCompleted() {
    var sum = 0;
    COURSES.forEach(function (c) { sum += progressForCourse(c.id).completed.length; });
    return sum;
  }
  function totalLessons() {
    var sum = 0;
    COURSES.forEach(function (c) { sum += c.lessons.length; });
    return sum;
  }

  /* ================= ROUTE HELPERS ================= */
  function findCourse(id) {
    for (var i = 0; i < COURSES.length; i++) if (COURSES[i].id === id) return COURSES[i];
    return null;
  }
  function currentCourse() { return findCourse(route.courseId); }
  function currentLesson() {
    var c = currentCourse();
    return c ? c.lessons[route.lessonIdx] : null;
  }
  function lessonKey(courseId, lessonId) { return courseId + ':' + lessonId; }
  function getSandboxCode(course, lesson) {
    var saved = loadSandbox(lessonKey(course.id, lesson.id));
    if (saved) return saved;
    var starter = lesson.sandbox.starter;
    return { html: starter.html || '', css: starter.css || '', js: starter.js || '' };
  }

  /* ================= SANDBOX ================= */
  function buildSrcdoc(lesson, code) {
    var type = lesson.sandbox.type;
    if (type === 'html') {
      return code.html || '';
    }
    if (type === 'tailwind') {
      return '<script src="https://cdn.tailwindcss.com"><\/script>' + (code.html || '');
    }
    if (type === 'html-css') {
      return '<style>' + (code.css || '') + '</style>' + (code.html || '');
    }
    if (type === 'js') {
      var consoleStyle = '<style>#__console{position:fixed;left:0;right:0;bottom:0;max-height:35%;overflow:auto;margin:0;padding:10px 12px;background:#161B22;color:#8FE3B0;font-family:monospace;font-size:12px;white-space:pre-wrap;border-top:2px solid #3E6990;}</style>';
      var runner = '<script>(function(){var out=document.getElementById("__console");var lines=[];function paint(){out.textContent=lines.join("\\n");}var orig=console.log;console.log=function(){var parts=[];for(var i=0;i<arguments.length;i++){var a=arguments[i];try{parts.push(typeof a==="object"?JSON.stringify(a):String(a));}catch(e){parts.push(String(a));}}lines.push(parts.join(" "));paint();orig.apply(console,arguments);};try{' + (code.js || '') + '\n}catch(e){lines.push("Error: "+e.message);paint();}})();<\/script>';
      return (code.html || '') + consoleStyle + '<pre id="__console"></pre>' + runner;
    }
    return '';
  }
  function updatePreview() {
    var course = currentCourse(), lesson = currentLesson();
    if (!course || !lesson) return;
    var type = lesson.sandbox.type;
    var code = {};
    var htmlTa = document.getElementById('editor-html');
    var cssTa = document.getElementById('editor-css');
    var jsTa = document.getElementById('editor-js');
    if (htmlTa) code.html = htmlTa.value;
    if (cssTa) code.css = cssTa.value;
    if (jsTa) code.js = jsTa.value;
    var iframe = document.getElementById('preview-frame');
    if (iframe) iframe.srcdoc = buildSrcdoc(lesson, code);
    saveSandbox(lessonKey(course.id, lesson.id), code);
  }
  function scheduleAutoRun() {
    /* Only auto-run while typing for HTML/CSS sandboxes, which are cheap to
       re-render. JS sandboxes would re-execute partially-typed code on every
       keystroke (throwing errors mid-word), and Tailwind sandboxes would
       reload the CDN script and flicker on every keystroke. Both instead
       update only on an explicit Run click, on lesson load, and on Reset. */
    var lesson = currentLesson();
    if (!lesson || (lesson.sandbox.type !== 'html' && lesson.sandbox.type !== 'html-css')) return;
    clearTimeout(autoRunTimer);
    autoRunTimer = setTimeout(updatePreview, 500);
  }
  function resetSandboxToStarter() {
    var lesson = currentLesson();
    if (!lesson) return;
    var starter = lesson.sandbox.starter;
    var htmlTa = document.getElementById('editor-html');
    var cssTa = document.getElementById('editor-css');
    var jsTa = document.getElementById('editor-js');
    if (htmlTa) htmlTa.value = starter.html || '';
    if (cssTa) cssTa.value = starter.css || '';
    if (jsTa) jsTa.value = starter.js || '';
    updatePreview();
  }
  function switchTab(tabName) {
    document.querySelectorAll('.editor-tab').forEach(function (t) {
      t.classList.toggle('active', t.getAttribute('data-tab') === tabName);
    });
    document.querySelectorAll('.editor-textarea').forEach(function (t) {
      t.classList.toggle('hidden', t.getAttribute('data-field') !== tabName);
    });
  }

  /* ================= QUIZ ================= */
  function getQuizState(courseId) {
    if (!quizState[courseId]) quizState[courseId] = { answers: {}, submitted: false, score: 0, correctCount: 0 };
    return quizState[courseId];
  }
  function selectAnswer(qIndex, optIndex) {
    var qs = getQuizState(route.courseId);
    if (qs.submitted) return;
    qs.answers[qIndex] = optIndex;
    var group = document.querySelector('.quiz-question[data-q="' + qIndex + '"]');
    if (group) {
      group.querySelectorAll('.quiz-option').forEach(function (o) {
        o.classList.toggle('selected', parseInt(o.getAttribute('data-opt'), 10) === optIndex);
      });
    }
  }
  function submitQuiz() {
    var course = currentCourse();
    var qs = getQuizState(route.courseId);
    var correctCount = 0;
    course.quiz.forEach(function (q, qi) { if (qs.answers[qi] === q.correct) correctCount++; });
    var pct = Math.round((correctCount / course.quiz.length) * 100);
    qs.submitted = true;
    qs.score = pct;
    qs.correctCount = correctCount;
    var p = progressForCourse(route.courseId);
    p.quizBest = Math.max(p.quizBest || 0, pct);
    if (pct >= 70) p.quizPassed = true;
    saveProgress();
  }
  function resetQuiz(courseId) {
    quizState[courseId] = { answers: {}, submitted: false, score: 0, correctCount: 0 };
  }

  /* ================= THEME ================= */
  function isDarkActive() {
    var explicit = document.documentElement.getAttribute('data-theme');
    if (explicit) return explicit === 'dark';
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function toggleTheme() {
    var next = isDarkActive() ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('db_theme', next); } catch (e) { /* ignore */ }
    updateThemeToggleLabel();
  }
  function updateThemeToggleLabel() {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    var dark = isDarkActive();
    btn.innerHTML = dark ? '&#9728;' : '&#9789;';
    btn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
  }

  /* ================= VIEWS ================= */
  function renderHome() {
    var cards = COURSES.map(function (c, i) {
      var p = progressForCourse(c.id);
      var total = c.lessons.length;
      var done = p.completed.length;
      var pct = Math.round((done / total) * 100);
      var status = p.quizPassed ? 'Signed off' : (done === total ? 'Ready for inspection' : (done > 0 ? 'In progress' : 'Not started'));
      return '' +
        '<button class="sheet" data-action="go-track" data-course="' + c.id + '" style="--tab-color:' + c.color + '">' +
          '<div class="sheet-tab"></div>' +
          '<div class="sheet-body">' +
            '<div class="sheet-meta">SHEET ' + String(i + 1).padStart(2, '0') + ' &middot; ' + done + '/' + total + ' LESSONS</div>' +
            '<h3 class="sheet-title">' + c.title + '</h3>' +
            '<p class="sheet-desc">' + c.description + '</p>' +
            '<div class="sheet-progress"><div class="sheet-progress-fill" style="width:' + pct + '%"></div></div>' +
            '<div class="sheet-status">' + status + '</div>' +
          '</div>' +
        '</button>';
    }).join('');

    return '' +
      '<section class="hero">' +
        '<div class="title-block"><span class="stamp-label">Draftbench &mdash; interactive coding primer</span></div>' +
        '<h1 class="hero-title">Build things. Understand why they work.</h1>' +
        '<p class="hero-sub">Four short courses in HTML, CSS, JavaScript, and Tailwind CSS. Every lesson has a live sandbox to try the code, and a short inspection quiz at the end to check what stuck.</p>' +
      '</section>' +
      '<section class="sheet-grid">' + cards + '</section>';
  }

  function renderTrack(courseId) {
    var course = findCourse(courseId);
    var p = progressForCourse(courseId);
    var total = course.lessons.length;
    var done = p.completed.length;

    var rows = course.lessons.map(function (l, i) {
      var complete = p.completed.indexOf(l.id) !== -1;
      return '' +
        '<button class="lesson-row" data-action="go-lesson" data-course="' + course.id + '" data-lesson="' + i + '">' +
          '<span class="lesson-num">' + String(i + 1).padStart(2, '0') + '</span>' +
          '<span class="lesson-row-title">' + l.title + '</span>' +
          '<span class="lesson-check ' + (complete ? 'done' : '') + '">' + (complete ? '&#10003;' : '') + '</span>' +
        '</button>';
    }).join('');

    var quizNote = p.quizPassed
      ? ('Passed with a best score of ' + p.quizBest + '%. Retake any time.')
      : (done < total ? 'This can be taken early, but finishing every lesson first will help.' : 'All lessons are complete. Time for inspection.');

    return '' +
      '<nav class="breadcrumb"><button data-action="go-home">Home</button> / <span>' + course.title + '</span></nav>' +
      '<header class="track-header" style="--tab-color:' + course.color + '">' +
        '<div class="track-tab"></div>' +
        '<div>' +
          '<h1>' + course.title + '</h1>' +
          '<p>' + course.description + '</p>' +
          '<div class="sheet-progress wide" style="--tab-color:' + course.color + '"><div class="sheet-progress-fill" style="width:' + Math.round(done / total * 100) + '%"></div></div>' +
          '<span class="track-progress-label">' + done + ' of ' + total + ' lessons complete</span>' +
        '</div>' +
      '</header>' +
      '<div class="lesson-list">' + rows + '</div>' +
      '<button class="inspection-card" data-action="go-quiz" data-course="' + course.id + '">' +
        '<div>' +
          '<div class="sheet-meta">FINAL INSPECTION</div>' +
          '<h3>' + course.title + ' Quiz</h3>' +
          '<p>' + quizNote + '</p>' +
        '</div>' +
        '<span class="inspection-arrow">' + (p.quizPassed ? '&#10003;' : '&rarr;') + '</span>' +
      '</button>';
  }

  function buildEditorHtml(lesson, code) {
    var type = lesson.sandbox.type;
    var tabs = '', textareas = '';
    if (type === 'html' || type === 'tailwind') {
      tabs = '<div class="editor-tabs"><span class="editor-tab active" data-action="switch-tab" data-tab="html">HTML</span></div>';
      textareas = '<textarea id="editor-html" class="editor-textarea" data-field="html" spellcheck="false">' + escapeHtml(code.html || '') + '</textarea>';
    } else if (type === 'html-css') {
      tabs = '<div class="editor-tabs">' +
        '<span class="editor-tab active" data-action="switch-tab" data-tab="html">HTML</span>' +
        '<span class="editor-tab" data-action="switch-tab" data-tab="css">CSS</span>' +
      '</div>';
      textareas =
        '<textarea id="editor-html" class="editor-textarea" data-field="html" spellcheck="false">' + escapeHtml(code.html || '') + '</textarea>' +
        '<textarea id="editor-css" class="editor-textarea hidden" data-field="css" spellcheck="false">' + escapeHtml(code.css || '') + '</textarea>';
    } else if (type === 'js') {
      tabs = '<div class="editor-tabs">' +
        '<span class="editor-tab active" data-action="switch-tab" data-tab="html">HTML</span>' +
        '<span class="editor-tab" data-action="switch-tab" data-tab="js">JS</span>' +
      '</div>';
      textareas =
        '<textarea id="editor-html" class="editor-textarea" data-field="html" spellcheck="false">' + escapeHtml(code.html || '') + '</textarea>' +
        '<textarea id="editor-js" class="editor-textarea hidden" data-field="js" spellcheck="false">' + escapeHtml(code.js || '') + '</textarea>';
    }
    var needsRunHint = (type === 'js' || type === 'tailwind');
    return '' +
      '<div class="editor-card">' + tabs + textareas + '</div>' +
      '<div class="editor-toolbar">' +
        '<button class="btn small primary" data-action="run-sandbox">&#9654; Run</button>' +
        '<button class="btn small ghost" data-action="reset-sandbox">Reset</button>' +
        (needsRunHint ? '<span class="editor-hint">Click Run to see changes</span>' : '') +
      '</div>' +
      '<div class="preview-card">' +
        '<div class="preview-head">Preview</div>' +
        '<iframe id="preview-frame" class="preview-frame" sandbox="allow-scripts allow-same-origin allow-forms" title="Live preview"></iframe>' +
      '</div>';
  }

  function renderLesson(courseId, lessonIdx) {
    var course = findCourse(courseId);
    var lesson = course.lessons[lessonIdx];
    var isFirst = lessonIdx === 0;
    var isLast = lessonIdx === course.lessons.length - 1;
    var code = getSandboxCode(course, lesson);
    var complete = isLessonComplete(course.id, lesson.id);

    var contentHtml = lesson.content.map(function (p) { return '<p>' + renderInline(p) + '</p>'; }).join('');
    var highlighted = lesson.exampleLang === 'css' ? highlightCSS(lesson.example)
      : lesson.exampleLang === 'js' ? highlightJS(lesson.example)
      : highlightHTML(lesson.example);

    return '' +
      '<nav class="breadcrumb">' +
        '<button data-action="go-home">Home</button> / ' +
        '<button data-action="go-track" data-course="' + course.id + '">' + course.title + '</button> / ' +
        '<span>' + lesson.title + '</span>' +
      '</nav>' +
      '<div class="lesson-grid">' +
        '<div class="panel plan-panel">' +
          '<div class="panel-label">THE PLAN</div>' +
          '<h1>' + lesson.title + '</h1>' +
          '<div class="lesson-copy">' + contentHtml + '</div>' +
          '<div class="code-card">' +
            '<div class="code-card-head">Example</div>' +
            '<pre class="code-block"><code>' + highlighted + '</code></pre>' +
          '</div>' +
        '</div>' +
        '<div class="panel bench-panel">' +
          '<div class="panel-label accent">THE BENCH &mdash; try it live</div>' +
          buildEditorHtml(lesson, code) +
        '</div>' +
      '</div>' +
      '<div class="lesson-nav">' +
        '<button class="btn ghost" data-action="prev-lesson"' + (isFirst ? ' disabled' : '') + '>&larr; Previous</button>' +
        '<button class="btn primary" data-action="complete-lesson">' + (complete ? 'Mark reviewed' : 'Mark complete') + (isLast ? ' &amp; go to inspection' : ' &amp; continue') + ' &rarr;</button>' +
      '</div>';
  }

  function renderQuiz(courseId) {
    var course = findCourse(courseId);
    var qs = getQuizState(courseId);

    var questions = course.quiz.map(function (q, qi) {
      var options = q.options.map(function (opt, oi) {
        var selected = qs.answers[qi] === oi;
        var cls = 'quiz-option' + (selected ? ' selected' : '');
        if (qs.submitted) {
          if (oi === q.correct) cls += ' correct';
          else if (selected && oi !== q.correct) cls += ' incorrect';
        }
        return '<button class="' + cls + '" data-action="select-answer" data-q="' + qi + '" data-opt="' + oi + '"' + (qs.submitted ? ' disabled' : '') + '>' + renderInline(opt) + '</button>';
      }).join('');
      return '' +
        '<div class="quiz-question" data-q="' + qi + '">' +
          '<div class="quiz-q-label">Question ' + (qi + 1) + '</div>' +
          '<p class="quiz-q-text">' + renderInline(q.question) + '</p>' +
          '<div class="quiz-options">' + options + '</div>' +
          (qs.submitted ? '<p class="quiz-explain">' + renderInline(q.explanation) + '</p>' : '') +
        '</div>';
    }).join('');

    var resultBlock = '';
    if (qs.submitted) {
      var passed = qs.score >= 70;
      resultBlock = '' +
        '<div class="stamp-result ' + (passed ? 'pass' : 'fail') + '">' +
          '<div class="stamp">' + (passed ? 'PASSED' : 'REVISE') + '</div>' +
          '<p>' + qs.correctCount + ' of ' + course.quiz.length + ' correct, ' + qs.score + '%</p>' +
        '</div>';
    }

    return '' +
      '<nav class="breadcrumb">' +
        '<button data-action="go-home">Home</button> / ' +
        '<button data-action="go-track" data-course="' + course.id + '">' + course.title + '</button> / ' +
        '<span>Final Inspection</span>' +
      '</nav>' +
      '<header class="quiz-header">' +
        '<div class="panel-label accent">FINAL INSPECTION</div>' +
        '<h1>' + course.title + ' Quiz</h1>' +
        '<p>Answer all ' + course.quiz.length + ' questions, then submit for inspection.' + (qs.submitted ? '' : ' A score of 70% or higher passes.') + '</p>' +
      '</header>' +
      resultBlock +
      '<div class="quiz-list">' + questions + '</div>' +
      (qs.submitted
        ? '<button class="btn primary" data-action="retake-quiz" data-course="' + course.id + '">Retake quiz</button>'
        : '<button class="btn primary" data-action="submit-quiz">Submit for inspection</button>');
  }

  /* ================= RENDER DISPATCH ================= */
  function render() {
    var app = document.getElementById('app');
    if (route.view === 'home') {
      app.innerHTML = renderHome();
    } else if (route.view === 'track') {
      app.innerHTML = renderTrack(route.courseId);
    } else if (route.view === 'lesson') {
      app.innerHTML = renderLesson(route.courseId, route.lessonIdx);
      updatePreview();
    } else if (route.view === 'quiz') {
      app.innerHTML = renderQuiz(route.courseId);
    }
    renderHeaderProgress();
    window.scrollTo(0, 0);
  }
  function renderHeaderProgress() {
    var el = document.getElementById('header-progress');
    if (el) el.textContent = totalLessonsCompleted() + ' / ' + totalLessons() + ' lessons';
  }

  /* ================= EVENTS ================= */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');
    var course;
    if (action === 'go-home') { route = { view: 'home' }; render(); }
    else if (action === 'go-track') { route = { view: 'track', courseId: el.getAttribute('data-course') }; render(); }
    else if (action === 'go-lesson') { route = { view: 'lesson', courseId: el.getAttribute('data-course'), lessonIdx: parseInt(el.getAttribute('data-lesson'), 10) }; render(); }
    else if (action === 'go-quiz') { route = { view: 'quiz', courseId: el.getAttribute('data-course') }; render(); }
    else if (action === 'prev-lesson') { route.lessonIdx = Math.max(0, route.lessonIdx - 1); render(); }
    else if (action === 'complete-lesson') {
      markComplete(route.courseId, currentLesson().id);
      course = currentCourse();
      if (route.lessonIdx < course.lessons.length - 1) route.lessonIdx++;
      else route.view = 'quiz';
      render();
    }
    else if (action === 'run-sandbox') { updatePreview(); }
    else if (action === 'reset-sandbox') { resetSandboxToStarter(); }
    else if (action === 'switch-tab') { switchTab(el.getAttribute('data-tab')); }
    else if (action === 'select-answer') { selectAnswer(el.getAttribute('data-q'), parseInt(el.getAttribute('data-opt'), 10)); }
    else if (action === 'submit-quiz') { submitQuiz(); render(); }
    else if (action === 'retake-quiz') { resetQuiz(el.getAttribute('data-course')); render(); }
    else if (action === 'toggle-theme') { toggleTheme(); }
  });
  document.addEventListener('input', function (e) {
    if (e.target.classList && e.target.classList.contains('editor-textarea')) scheduleAutoRun();
  });
  document.addEventListener('keydown', function (e) {
    if (e.target.classList && e.target.classList.contains('editor-textarea') && e.key === 'Tab') {
      e.preventDefault();
      var ta = e.target, start = ta.selectionStart, end = ta.selectionEnd;
      ta.value = ta.value.slice(0, start) + '  ' + ta.value.slice(end);
      ta.selectionStart = ta.selectionEnd = start + 2;
      scheduleAutoRun();
    }
  });

  /* ================= INIT ================= */
  function init() {
    var savedTheme = null;
    try { savedTheme = localStorage.getItem('db_theme'); } catch (e) { /* ignore */ }
    if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeToggleLabel();
    render();
  }
  init();
})();
</script>
</body>
</html>
